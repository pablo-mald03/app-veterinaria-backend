spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false
        format_sql: false
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: test-secret-key-for-ci-only-at-least-32-chars-long
  expiration: 900000
  refresh-window: 604800000

cors-site:
  url: http://localhost:3000

reserved:
  super-role: SUPER_ADMIN

server:
  port: 0
  servlet:
    context-path: /api/v1
    session:
      cookie:
        secure: false
        http-only: true
        same-site: lax

logging:
  level:
    root: WARN
    com.happypets: INFO

name: test