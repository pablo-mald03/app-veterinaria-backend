name: CI - Integración Continua

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper
        run: chmod +x ./mvnw

      - name: Compilar
        run: ./mvnw clean compile --batch-mode --no-transfer-progress

      - name: Ejecutar pruebas
        run: ./mvnw test --batch-mode --no-transfer-progress

      - name: Empaquetar (sin pruebas)
        run: ./mvnw package -DskipTests --batch-mode --no-transfer-progress

      - name: Subir artefacto (JAR)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7