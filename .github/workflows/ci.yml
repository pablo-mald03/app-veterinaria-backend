name: CI - Integración Continua

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Compilacion y Chequeo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper
        run: chmod +x ./mvnw

      - name: Verificar compilación de Spring Boot
        run: ./mvnw clean compile --batch-mode --no-transfer-progress