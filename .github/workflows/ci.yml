name: CI - Integracion Continua

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-check:
    name: Compilacion y Chequeo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper
        run: chmod +x ./mvnw

      - name: Verificar compilacion de Spring Boot
        run: ./mvnw clean compile --batch-mode --no-transfer-progress

  test:
    name: Pruebas Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-check

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper
        run: chmod +x ./mvnw

      - name: Ejecutar pruebas
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw test --batch-mode --no-transfer-progress

      - name: Publicar reportes de Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7